<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CSS урок 1</title>
</head>
<body>
    <h1>Моя первая стилизованная страница</h1>
    <form action="#" method="get">
        <label>Ваше имя:</label>
        <input type="text" name="username"><br>
        <input type="password" name="password"><br>
        <br>
        <label><input type="checkbox" name="hobby" value="sport">Спорт</label><br>
        <label><input type="checkbox" name="hobby" value="music">Музыка</label><br>

        <br>
        <label><input type="checkbox" name="color" value="black">Черный</label><br>
        <label><input type="checkbox" name="color" value="white">Белый</label><br>
        <br>
        <label><input type="radio" name="gender" value="male"> Мужской</label><br>
        <label><input type="radio" name="gender" value="female"> Женский</label><br>

        <button type="submit">Отправить</button>
    </form>
</body>
</html>
